[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "realtime-call-agent"
version = "0.1.0"
description = "Real-time AI phone agent: Twilio Media Streams <-> OpenAI Realtime speech-to-speech, with barge-in, background tools and outbound call missions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ashar Tanveer" }]
keywords = ["voice-agent", "twilio", "openai-realtime", "speech-to-speech", "telephony", "llm-agents"]
dependencies = [
    "aiohttp>=3.9",
    "twilio>=9.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "ruff>=0.5",
]

[project.scripts]
callagent = "callagent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/callagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# test helpers poll with explicit timeouts on purpose
"tests/*" = ["ASYNC109", "ASYNC110"]
